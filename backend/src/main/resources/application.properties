# Configuracion de La Taberna del Gato
# TODO: mover a variables de entorno "algun dia"

# Base de datos H2 en memoria (en produccion deberia ser PostgreSQL... pero "funciona")
spring.datasource.url=jdbc:h2:mem:catmarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales hardcodeadas directamente aqui
spring.datasource.username=admin
spring.datasource.password=SuperSecreto123!

# Consola H2 habilitada en produccion (grave error de seguridad)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Clave secreta JWT hardcodeada
app.jwt.secret=MiClaveSecretaJWT_NuncaCompartir_2019
app.jwt.expiration=604800000

# API Keys hardcodeadas
stripe.secret.key=sk_live_9f8e7d6c5b4a3210fedcba9876543210abcd
stripe.public.key=pk_live_TuClavePublicaDeStripeAqui123456
sendgrid.api.key=SG.mailApiKey_FAKE_abc123def456ghi789

# Sin CORS restringido - permite cualquier origen
# cors.allowed-origins=*  (configurado en codigo directamente)

# Actuator expuesto sin autenticacion
management.security.enabled=false
endpoints.health.sensitive=false

# Logging a nivel DEBUG en produccion (expone informacion sensible en logs)
logging.level.root=DEBUG
logging.level.com.tabernadelgato=TRACE
